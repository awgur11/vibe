services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: vibe_app
    user: "1000:1000"
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: vibe_nginx
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - default
      - local_network

  mysql:
    image: mysql:8.0
    container_name: vibe_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vibe
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: vibe
      MYSQL_PASSWORD: secret
    ports:
      - "127.0.0.1:3316:3306"
    volumes:
      - vibe_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vibe_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

volumes:
  vibe_mysql_data:

networks:
  local_network:
    external: true
